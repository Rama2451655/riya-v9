name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Download offline speech models (Vosk)
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets/models
          cd app/src/main/assets/models
          for pair in "vosk-model-small-en-in-0.4:en-in" "vosk-model-small-en-us-0.15:en-us"; do
            name="${pair%%:*}"
            dir="${pair##*:}"
            curl -L --fail --retry 3 -o "$name.zip" "https://alphacephei.com/vosk/models/$name.zip"
            unzip -q "$name.zip"
            mv "$name" "$dir"
            rm "$name.zip"
          done
          ls
          ls en-in
      - name: Build (prints Kotlin errors at the top of the run page)
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --warning-mode=none 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | while read -r line; do echo "::error::$line"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Riya-APK
          path: app/build/outputs/apk/debug/app-debug.apk
